name: military_calisthenics_women
description: "Bodyweight strength training for women — no gym, no equipment, structured like military calisthenics."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cloud_firestore: 6.2.0
  firebase_analytics: 12.2.0
  firebase_auth: 6.3.0
  firebase_core: 4.6.0
  firebase_messaging: 16.1.3
  firebase_storage: 13.2.0
  flutter_dotenv: ^6.0.0
  flutter_svg: ^2.2.1
  google_fonts: ^6.2.1
  google_sign_in: ^7.1.1
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.4.0+8
  in_app_purchase_storekit: ^0.4.7
  intl: ^0.20.2
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  health: ^13.0.1
  cupertino_icons: ^1.0.8
  flutter_timezone: ^5.0.2
  sign_in_with_apple: ^7.0.1
  video_player: ^2.9.5
  image_picker: ^1.1.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path_ios: "assets/branding/app_icon.png"
  image_path_android: "assets/branding/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0752A3"
  adaptive_icon_foreground: "assets/branding/app_icon.png"
  adaptive_icon_foreground_inset: 12

flutter_native_splash:
  color: "#0A0A0A"
  color_dark: "#0A0A0A"
  android_12:
    color: "#0A0A0A"
    icon_background_color: "#0A0A0A"
  fullscreen: false

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/workouts/
    - assets/launch_animation/
    - .env
